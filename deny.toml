# Supply-chain policy, enforced in CI with `cargo deny check`.
# See docs/SECURITY.md ("Engineering practices").

[graph]
all-features = false

[advisories]
# Fail on any crate with a security advisory in the RustSec database.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only; anything else needs a deliberate decision here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# ring's licence file combines ISC, MIT and OpenSSL-style terms.
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The old, unmaintained OpenSSL bindings have no place in this project.
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
