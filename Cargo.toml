[workspace]
resolver = "2"
members = ["crates/tether-cli", "crates/tether-core", "crates/tether-daemon", "crates/tether-ipc", "crates/tether-os", "crates/tether-sim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

# Optimise dependencies (notably the Ed25519 and curve code) even in debug and
# test builds; our own crates stay unoptimised for fast rebuilds and debugging.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
tether-cli = { path = "crates/tether-cli", version = "0.1.0" }
tether-core = { path = "crates/tether-core", version = "0.1.0" }
tether-ipc = { path = "crates/tether-ipc", version = "0.1.0" }
tether-os = { path = "crates/tether-os", version = "0.1.0" }
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
mdns-sd = "0.13"
postcard = { version = "1", features = ["use-std"] }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
