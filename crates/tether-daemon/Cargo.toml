[package]
name = "tether-daemon"
description = "The Tether background daemon: discovery, QUIC transport, clipboard sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tetherd"
path = "src/main.rs"

[dependencies]
tether-core.workspace = true
anyhow.workspace = true
arboard.workspace = true
clap.workspace = true
mdns-sd.workspace = true
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser = "0.18"
keyring = "4"
getrandom = "0.4"
dirs = "7"
zeroize = "1"
postcard = { workspace = true, features = ["use-std"] }
# Encrypted storage (P1.1): SQLite compiled in (no system library, no
# OpenSSL), each row sealed with XChaCha20-Poly1305. Nonces come from
# getrandom above, so that feature of the crate is off.
rusqlite = { version = "0.43", features = ["bundled"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# Local control channel (P1.2).
tether-ipc.workspace = true
serde.workspace = true

[dev-dependencies]
tether-ipc.workspace = true
